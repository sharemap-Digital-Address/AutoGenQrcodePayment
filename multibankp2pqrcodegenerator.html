<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRPh Tool (All-in-One Multi-Bank Fixed)</title>
    <!-- Mga kinakailangang library para sa pag-scan at pag-generate ng QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0052cc; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        .network-indicator { text-align: center; font-weight: bold; color: #28a745; margin-bottom: 15px; font-size: 15px; display: block; padding: 8px; background: #eef9f0; border-radius: 4px; border: 1px solid #c3e6cb; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; font-size: 13px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background-color: #f9f9f9; }
        #edit-text-3, #edit-text-5 { background-color: #fff !important; border: 2px solid #0052cc !important; font-weight: bold; }
        #edit-text-5 { color: #0052cc; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #0052cc; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; margin-bottom: 10px; }
        button:hover { background-color: #0041a3; }
        .btn-decode { background-color: #0052cc; }
        .btn-generate { background-color: #28a745; }
        .btn-generate:hover { background-color: #218838; }
        #qr-reader-box { width: 100%; margin-bottom: 15px; border: 2px dashed #0052cc; border-radius: 4px; padding: 20px; text-align: center; background: #f0f5ff; box-sizing: border-box; }
        #result-qr-container { text-align: center; margin-top: 20px; padding: 15px; background: #eef9f0; border: 1px solid #c3e6cb; border-radius: 8px; display: none; }
        #qrcode { display: inline-block; margin-top: 10px; padding: 15px; background: white; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <h2>QRPh Tool4 (Multi-Bank Fixed)</h2>
    <div class="subtitle">Matalinong Pag-parse para sa GCash, Maya, at CIMB</div>
    
    <!-- 1) PUMILI NG QR IMAGE -->
    <div id="qr-reader-box">
        <label for="qr-file" style="cursor: pointer; display: block; margin: 0; font-size: 15px;">
            📸 1) Pumili ng QR Image (Basahin ang QR Code)
        </label>
        <input type="file" id="qr-file" accept="image/*" style="display: none;">
    </div>

    <div id="detected-bank" class="network-indicator">Detected Network: Wala pang napipiling QR</div>

    <button id="btn-decode" class="btn-decode">I-decode ang Impormasyon ng Account</button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <!-- 2) 6 NA BAHAGI NG QR STRING -->
    <div class="form-group">
        <label>• EditText 1 (Header/Format) - [Auto Static/Dynamic]:</label>
        <input type="text" id="edit-text-1" placeholder="Awtomatikong mapupunan..." readonly>
    </div>

    <div class="form-group">
        <label>• EditText 2 (Merchant Info Base / Main Block) - [Readonly]:</label>
        <input type="text" id="edit-text-2" placeholder="Awtomatikong mapupunan..." readonly>
    </div>

    <div class="form-group">
        <label style="color: #0052cc;">• EditText 3 (Routing / Opsyonal) - [EDITABLE]:</label>
        <input type="text" id="edit-text-3" placeholder="Awtomatikong mapupunan...">
    </div>

    <div class="form-group">
        <label>• EditText 4 (Tag 27 / Extra Blocks) - [Readonly]:</label>
        <input type="text" id="edit-text-4" placeholder="Awtomatikong mapupunan..." readonly>
    </div>

    <div class="form-group">
        <label style="color: #28a745;">• EditText 5 (Halaga / Amount) - [ANG EDITABLE PART]:</label>
        <input type="number" id="edit-text-5" placeholder="0.00" step="0.01">
    </div>

    <div class="form-group">
        <label>• EditText 6 (CRC Checksum) - [Auto-updated]:</label>
        <input type="text" id="edit-text-6" placeholder="Awtomatikong mapupunan..." readonly>
    </div>

    <!-- 3) GENERATE BUTTON -->
    <button id="btn-generate" class="btn-generate">2. Generate Bagong QR Code</button>

    <!-- 4) OUTPUT DISPLAY -->
    <div id="result-qr-container">
        <h3 style="color: #155724; margin-top: 0;">Buong QR String na may CRC Hash:</h3>
        <input type="text" id="final-string-output" readonly style="background-color: #fff; text-align: center; font-family: monospace; font-size: 12px; margin-bottom: 15px;">
        <div>
            <div id="qrcode"></div>
        </div>
        <button id="btn-download" style="background-color: #6c757d; width: auto; font-size: 14px; padding: 8px 15px;">I-download ang QR Image (May Quiet Zone)</button>
    </div>
</div>

<script>
    let rawDecodedString = "";
    let detectedBankType = "GCASH";

    // CRC16 CCITT standard calculator function
    function calculate_crc(str) { 
        let crc = 0xFFFF; 
        for (let c = 0; c < str.length; c++) { 
            crc ^= str.charCodeAt(c) << 8; 
            for (let i = 0; i < 8; i++) { 
                if ((crc & 0x8000) !== 0) { 
                    crc = ((crc << 1) ^ 0x1021) & 0xFFFF; 
                } else { 
                    crc = (crc << 1) & 0xFFFF; 
                } 
            } 
        } 
        return crc.toString(16).toUpperCase().padStart(4, '0'); 
    }

    // 1. Pagbasa sa QR Image gamit ang Html5Qrcode library
    document.getElementById('qr-file').addEventListener('change', function(e) {
        if (!e.target.files || e.target.files.length === 0) return;
        
        const imageFile = e.target.files[0];
        const readerBox = document.getElementById('qr-reader-box');
        
        readerBox.style.background = "#fff";
        readerBox.innerText = "Ina-analyze ang larawan: " + imageFile.name;

        const html5QrCode = new Html5Qrcode("qr-reader-box");
        html5QrCode.scanFile(imageFile, true)
            .then(decodedText => {
                rawDecodedString = decodedText;
                readerBox.innerHTML = `✅ Tagumpay na na-scan! Handa nang i-decode.<br><small style="word-break: break-all; color: #555;">${decodedText.substring(0, 40)}...</small>`;
                readerBox.style.background = "#e2f0d9";
            })
            .catch(err => {
                readerBox.innerText = "❌ Hindi mabasang QR Code. Subukan uli ang ibang larawan.";
                readerBox.style.background = "#fce4d6";
                console.error(err);
            });
    });

    // 2. Matalinong Pag-decode para sa GCash, Maya, at CIMB
    document.getElementById('btn-decode').addEventListener('click', function() {
        let textToParse = rawDecodedString;
        let indicatorEl = document.getElementById('detected-bank');
        
        if (!textToParse) {
            alert("Mangyaring pumili at mag-abang muna na matagumpay na ma-scan ang QR code image.");
            return;
        }

        // Nilinis ang ANUMANG umiiral na Tag 54 gamit ang malawak na regex
        textToParse = textToParse.replace(/54\d{2}[0-9.]+/g, "");

        let crcIndex = textToParse.indexOf("6304");
        if (crcIndex === -1) {
            crcIndex = textToParse.length - 4;
        }
        let et6 = textToParse.substring(crcIndex);
        let coreText = textToParse.substring(0, crcIndex);

        let et1 = "", et2 = "", et3 = "", et4 = "";

        // -- URI 2: CIMB / GSave QR --
        if (textToParse.includes("cimb") || textToParse.includes("GSave") || textToParse.includes("ins.p2p") || textToParse.includes("p2pqrpay")) {
            detectedBankType = "CIMB";
            indicatorEl.innerText = "⚡ Detected Network: CIMB Pay / GSave Account";
            indicatorEl.style.color = "#d39e00";

            et1 = coreText.substring(0, 12);
            let remaining = coreText.substring(12);

            let tag27Index = -1;
            let tag59Pos = remaining.indexOf("59");
            if (tag59Pos !== -1) {
                let tag59Len = parseInt(remaining.substring(tag59Pos + 2, tag59Pos + 4), 10);
                tag27Index = tag59Pos + 4 + tag59Len;
            } else {
                tag27Index = remaining.indexOf("2761");
            }

            if (tag27Index !== -1) {
                et2 = remaining.substring(0, tag27Index); 
                et4 = remaining.substring(tag27Index);   
            } else {
                et2 = remaining;
                et4 = "";
            }
            et3 = ""; 

        } 
        // -- URI 1: MAYA P2P QR --
        else if (textToParse.includes("@p2p.maya") || textToParse.includes("p.ppoc.p2p")) {
            detectedBankType = "MAYA";
            indicatorEl.innerText = "⚡ Detected Network: Maya Universal QR";
            indicatorEl.style.color = "#28a745";

            et1 = coreText.substring(0, 12);
            let remaining = coreText.substring(12);

            let tagAliasIndex = remaining.indexOf("639");
            if (tagAliasIndex === -1) tagAliasIndex = 25;

            et2 = remaining.substring(0, tagAliasIndex);
            let afterEt2 = remaining.substring(tagAliasIndex);
            
            let nextBlockIndex = afterEt2.indexOf("0208");
            if (nextBlockIndex === -1) nextBlockIndex = 15;

            et3 = afterEt2.substring(0, nextBlockIndex);
            et4 = afterEt2.substring(nextBlockIndex);

        } 
        // -- URI 3: GCASH P2P QR (Default fallback) --
        else {
            detectedBankType = "GCASH";
            indicatorEl.innerText = "⚡ Detected Network: GCash P2P Account";
            indicatorEl.style.color = "#0052cc";

            et1 = coreText.substring(0, 12);
            let remaining = coreText.substring(12);

            let tag03Index = remaining.indexOf("0315");
            if (tag03Index === -1) tag03Index = 0;

            et2 = remaining.substring(0, tag03Index + 4);
            let afterEt2 = remaining.substring(tag03Index + 4);
            et3 = afterEt2.substring(0, 15);
            et4 = afterEt2.substring(15);
        }

        document.getElementById('edit-text-1').value = et1;
        document.getElementById('edit-text-2').value = et2;
        document.getElementById('edit-text-3').value = et3;
        document.getElementById('edit-text-4').value = et4;
        document.getElementById('edit-text-5').value = "";
        document.getElementById('edit-text-6').value = et6;

        alert("Tagumpay na na-decode ang QR code!");
    });

    // 3. Button 2 Logic: Generate Bagong QR Code (Iyong eksaktong CIMB Generation Logic)
    document.getElementById('btn-generate').addEventListener('click', function() {
        let et1 = document.getElementById('edit-text-1').value.trim(); 
        let et2 = document.getElementById('edit-text-2').value.trim(); 
        let et4 = document.getElementById('edit-text-4').value.trim(); 
        let et5 = document.getElementById('edit-text-5').value.trim(); 

        if (!et1) {
            alert("Mangyaring i-decode muna ang QR code bago mag-generate.");
            return;
        }

        // 1. SIGURADUHING MALINIS ANG HEADER (000201010212 o 11)
        let hasAmount = et5 && parseFloat(et5) > 0;
        let header = et1.substring(0, 10) + (hasAmount ? "12" : "11");
        document.getElementById('edit-text-1').value = header;

        // 2. LINISIN ANG ET2 (Tanggalin ang sumabit na pangalan o maling tags)
        let cleanEt2 = et2.replace(/54\d{2}[0-9.]+/g, "") 
                          .replace(/5303608/g, "") 
                          .replace(/59\d{2}[A-Za-z0-9 .]+/g, "") 
                          .replace(/JAYROME P\./g, ""); 

        // 3. BUOHIN ANG MGA STANDARD TAGS
        let amountTag = "";
        if (hasAmount) {
            let formattedAmount = parseFloat(et5).toFixed(2);
            let tagLength = String(formattedAmount).length.toString().padStart(2, '0');
            amountTag = "54" + tagLength + formattedAmount; 
        } 
        let currencyTag = "5303608"; 
        let merchantNameTag = "5910JAYROME P."; 

        // 4. SIGURADUHING BUO ANG BANK ROUTING AT WALANG BAWAS SA 540111
        let cleanEt4 = et4; 
        if (cleanEt4.startsWith("54") && !cleanEt4.startsWith("540111")) { 
            let match = cleanEt4.match(/^54\d{2}[0-9.]+/); 
            if (match) { 
                cleanEt4 = cleanEt4.substring(match[0].length); 
            } 
        } 

        let combinedStringWithoutCRC = "";
        if (detectedBankType === "CIMB") {
            // 5. EKSAKTONG PAGSAMA-SAMAHIN AYON SA EMVCO STANDARD LAYOUT PARA SA CIMB
            combinedStringWithoutCRC = header + cleanEt2 + amountTag + currencyTag + merchantNameTag + cleanEt4 + "6304"; 
        } else {
            let et3 = document.getElementById('edit-text-3').value;
            combinedStringWithoutCRC = header + cleanEt2 + et3 + cleanEt4 + "6304";
        }

        // 6. I-COMPUTE ANG TAMANG CRC
        let calculatedCRC = calculate_crc(combinedStringWithoutCRC); 
        let finalCompleteQRString = combinedStringWithoutCRC + calculatedCRC; 

        document.getElementById('edit-text-6').value = "6304" + calculatedCRC;
        document.getElementById('final-string-output').value = finalCompleteQRString;

        // Render QR Code graphic
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: finalCompleteQRString,
            width: 250,
            height: 250,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });

        document.getElementById('result-qr-container').style.display = "block";
    });

    // Download QR Image Logic
    document.getElementById('btn-download').addEventListener('click', function() {
        let qrImg = document.querySelector('#qrcode img');
        if (qrImg) {
            let link = document.createElement('a');
            link.href = qrImg.src;
            link.download = 'dynamic_multibank_qr.png';
            link.click();
        } else {
            alert("Gumawa muna ng QR bago i-download.");
        }
    });
</script>

</body>
</html>
