<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRPh Web POS Direct Decoder Tool</title>
    <!-- jsQR Library CDN para sa Offline/Online Client-side Extraction -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .pos-container { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-style: center; color: #0288d1; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; border: none; background-color: #0288d1; color: white; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #01579b; }
        .view-box { background: #f1f8e9; border-left: 5px solid #7cb342; padding: 12px; border-radius: 4px; font-family: monospace; word-break: break-all; margin-top: 5px; font-size: 13px; }
        .error { color: #d32f2f; background: #ffebee; border-left: 5px solid #d32f2f; padding: 10px; border-radius: 4px; display: none; margin-top: 10px; }
        .bank-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; margin-top: 5px; }
    </style>
</head>
<body>

<div class="pos-container">
    <h2>QRPh Web POS Direct Decoder Tool</h2>
    
    <!-- Link Input Element (Pasting the Google Direct Link) -->
    <div class="input-group">
        <label for="linkInput">Google Drive Direct Image Link:</label>
        <input type="text" id="linkInput" placeholder="I-paste ang https://lh3.googleusercontent.com/d/..." value="https://lh3.googleusercontent.com/d/1FLiJuo3WTmFZjUckYB8tSjS52Eb18RWj">
    </div>

    <button onclick="decodeAndProcessLink()">Decode QR Link</button>
    <div id="errorDisplay" class="error"></div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <!-- 1) TextView Parts (Display Area) -->
    <div class="input-group">
        <label>Detected Provider Network:</label>
        <div id="detectedBank" style="font-weight: bold; padding: 5px 0;">-- Naghihintay ng Scan --</div>
    </div>

    <div class="input-group">
        <label>Original Decoded Raw String:</label>
        <div id="rawStringView" class="view-box">-- Walang Data --</div>
    </div>

    <!-- 2) Edit Text Parts (Modifying the Amount) -->
    <div class="input-group">
        <label for="amountInput">Bagong Halaga / New Amount (PHP):</label>
        <input type="text" id="amountInput" placeholder="Halimbawa: 150.00 o 50" oninput="rebuildQRPhPayload()">
    </div>

    <div class="input-group">
        <label>Updated Final QRPh Output String (Ready for POS):</label>
        <div id="finalStringView" class="view-box" style="background: #e3f2fd; border-left-color: #2196f3;">-- Walang Data --</div>
    </div>
</div>

<script>
// Global variables para i-hold ang structural elements ng na-decode na account
let originalPayload = "";
let bankMode = "STANDARD"; // Maaaring maging CIMB o STANDARD
let staticBaseBeforeAmount = "";
let staticBaseAfterAmount = "";

function decodeAndProcessLink() {
    const url = document.getElementById('linkInput').value.trim();
    const errorBox = document.getElementById('errorDisplay');
    errorBox.style.display = "none";
    
    if(!url) {
        showError("Mangyaring mag-paste ng valid na link.");
        return;
    }

    // CORS-Safe Canvas Decoding Chain Engine
    const img = new Image();
    img.crossOrigin = "anonymous"; // Bypass storage CORS restrictions
    img.src = url;
    
    img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0, img.width, img.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        
        if (code) {
            originalPayload = code.data;
            document.getElementById('rawStringView').innerText = originalPayload;
            analyzeAndSplitPayload(originalPayload);
        } else {
            showError("Hindi mabasang maayos ang QR Code galing sa link. Siguraduhing ito ay malinaw na QRPh image.");
        }
    };

    img.onerror = function() {
        showError("Hindi ma-load ang imahe. Siguraduhing tama ang link at naka-set ito sa 'Anyone with the link' sa Google Drive.");
    };
}

function analyzeAndSplitPayload(payload) {
    const bankDisplay = document.getElementById('detectedBank');
    
    // Alamin kung CIMB base sa infrastructure identification code
    if (payload.includes("CIPHPHMMXXX")) {
        bankMode = "CIMB";
        bankDisplay.innerHTML = '<span class="bank-badge" style="background-color: #de1f26;">CIMB Bank Philippines (No Decimal Format)</span>';
    } else if (payload.includes("G-Xchange") || payload.includes("com.p2pqrpay")) {
        bankMode = "STANDARD";
        bankDisplay.innerHTML = '<span class="bank-badge" style="background-color: #0056ef;">GCash / Standard QRPh (Decimal Format)</span>';
    } else {
        bankMode = "STANDARD";
        bankDisplay.innerHTML = '<span class="bank-badge" style="background-color: #616161;">Universal QRPh Match</span>';
    }

    // Hanapin kung nasaan ang Tag 54 (Amount field identifier)
    const tag54Index = payload.indexOf("54");
    if (tag54Index !== -1) {
        // Kunin ang haba ng umiiral na amount string base sa 2-digit length standard
        const currentLength = parseInt(payload.substring(tag54Index + 2, tag54Index + 4), 10);
        const totalTag54Length = 4 + currentLength; // 2 chars (tag) + 2 chars (len) + mismong amount value
        
        // I-isolate ang fixed segments
        // Ang unahan ay papalitan natin ang Dynamic Header pattern mula 0211 (static) to 0212 (dynamic)
        let headerSegment = payload.substring(0, tag54Index);
        if(headerSegment.startsWith("000201010211")) {
            headerSegment = "000201010212" + headerSegment.substring(12);
        }
        
        staticBaseBeforeAmount = headerSegment;
        
        // I-cut ang natitirang string pagkatapos ng lumang Tag 54 halaga pababa sa huling CRC entry
        staticBaseAfterAmount = payload.substring(tag54Index + totalTag54Length, payload.length - 4);
        
        // Basahin ang default initial value nito
        const currentAmountVal = payload.substring(tag54Index + 4, tag54Index + 4 + currentLength);
        document.getElementById('amountInput').value = parseFloat(currentAmountVal).toFixed(2);
        
        rebuildQRPhPayload();
    } else {
        // Edge Case: Static QR na walang nakatakdang Tag 54 sa orihinal na payload
        // Gagawa tayo ng insertion base bago pumasok ang Tag 58 o Tag 59 structures
        const tag58Index = payload.indexOf("58");
        staticBaseBeforeAmount = payload.substring(0, tag58Index);
        staticBaseAfterAmount = payload.substring(tag58Index, payload.length - 4);
        rebuildQRPhPayload();
    }
}

function rebuildQRPhPayload() {
    if (!staticBaseBeforeAmount) return;

    let amountInput = document.getElementById('amountInput').value.replace(/[^0-9.]/g, '');
    if (!amountInput || parseFloat(amountInput) <= 0) {
        document.getElementById('finalStringView').innerText = "Maglagay ng tamang halaga...";
        return;
    }

    let formattedAmount = "";
    if (bankMode === "CIMB") {
        // CIMB Rule Exception: Gawing integer/buong numero lamang nang walang tuldok (.00)
        formattedAmount = Math.round(parseFloat(amountInput)).toString();
    } else {
        // Standard E-Wallet Rule: Laging may dalawang decimal places (.00)
        formattedAmount = parseFloat(amountInput).toFixed(2);
    }

    // Kalkulahin ang 2-digit length field indicator
    const amountLength = formattedAmount.length.toString().padStart(2, '0');
    const newTag54Segment = "54" + amountLength + formattedAmount;

    // Isama nang magkakasunod ang data block (Header + Bagong Presyo + Account Information Body)
    const assembledPayloadWithoutCRC = staticBaseBeforeAmount + newTag54Segment + staticBaseAfterAmount;

    // Patakbuhin ang CRC-16 Engine para ikandado ang data payload
    const finalCRC = calculateCRC16(assembledPayloadWithoutCRC);
    
    document.getElementById('finalStringView').innerText = assembledPayloadWithoutCRC + finalCRC;
}

// Standard ISO 14443-4 / EMVCo Specification Polynomial CRC-16 Checksum Algorithm
function calculateCRC16(str) {
    let crc = 0xFFFF;
    for (let c = 0; c < str.length; c++) {
        crc ^= str.charCodeAt(c) << 8;
        for (let i = 0; i < 8; i++) {
            if (crc & 0x8000) {
                crc = (crc << 1) ^ 0x1021;
            } else {
                crc = crc << 1;
            }
        }
    }
    return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
}

function showError(msg) {
    const errorBox = document.getElementById('errorDisplay');
    errorBox.innerText = msg;
    errorBox.style.display = "block";
}
</script>

</body>
</html>
