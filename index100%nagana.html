<!DOCTYPE html>
<html lang="tl">
<head>
    <!----100% gumagana naka depende ang Qrcode na malilikha na inaapload, Qrcode amount apload kung mababa sa 50 ang qrcode amount na inapload ang huli number ng header ay 11 at kung mataas sa 50 ang qrcode upload ito ay 12-->
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRPh Tool2 (6 Fields)</title>
    <!-- Mga kinakailangang library para sa pag-scan at pag-generate ng QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0052cc; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; font-size: 13px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background-color: #f9f9f9; }
        #edit-text-3, #edit-text-5 { background-color: #fff !important; border: 2px solid #0052cc !important; font-weight: bold; }
        #edit-text-5 { color: #0052cc; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #0052cc; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; margin-bottom: 10px; }
        button:hover { background-color: #0041a3; }
        .btn-decode { background-color: #0052cc; }
        .btn-generate { background-color: #28a745; }
        .btn-generate:hover { background-color: #218838; }
        #qr-reader-box { width: 100%; margin-bottom: 15px; border: 2px dashed #0052cc; border-radius: 4px; padding: 20px; text-align: center; background: #f0f5ff; box-sizing: border-box; }
        #result-qr-container { text-align: center; margin-top: 20px; padding: 15px; background: #eef9f0; border: 1px solid #c3e6cb; border-radius: 8px; display: none; }
        #qrcode { display: inline-block; margin-top: 10px; padding: 15px; background: white; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <h2>QRPh Tool2 (6 Fields)</h2>
    <div class="subtitle">Manual Reverse & Generate with Phone Routing</div>
    
    <!-- 1) PUMILI NG QR IMAGE -->
    <div id="qr-reader-box">
        <label for="qr-file" style="cursor: pointer; display: block; margin: 0; font-size: 15px;">
            📸 1) Pumili ng QR Image (Basahin ang QR Code)
        </label>
        <input type="file" id="qr-file" accept="image/*" style="display: none;">
    </div>

    <button id="btn-decode" class="btn-decode">I-decode ang Impormasyon ng Account</button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <!-- 2) 6 NA BAHAGI NG QR STRING -->
    <div class="form-group">
        <label>• EditText 1 (Header/Format) - [Readonly]:</label>
        <input type="text" id="edit-text-1" placeholder="Awtomatikong mapupunan..." readonly>
    </div>

    <div class="form-group">
        <label>• EditText 2 (Merchant Info Base) - [Readonly]:</label>
        <input type="text" id="edit-text-2" placeholder="Awtomatikong mapupunan..." readonly>
    </div>

    <div class="form-group">
        <label style="color: #0052cc;">• EditText 3 (Phone Number / Routing Parameter) - [EDITABLE]:</label>
        <input type="text" id="edit-text-3" placeholder="Awtomatikong mapupunan...">
    </div>

    <div class="form-group">
        <label>• EditText 4 (Identity Tokens at Data Tags) - [Readonly]:</label>
        <input type="text" id="edit-text-4" placeholder="Awtomatikong mapupunan..." readonly>
    </div>

    <div class="form-group">
        <label style="color: #28a745;">• EditText 5 (Halaga / Amount) - [ANG EDITABLE PART]:</label>
        <input type="number" id="edit-text-5" placeholder="0.00" step="0.01">
    </div>

    <div class="form-group">
        <label>• EditText 6 (CRC Checksum) - [Auto-updated]:</label>
        <input type="text" id="edit-text-6" placeholder="Awtomatikong mapupunan..." readonly>
    </div>

    <!-- 3) GENERATE BUTTON -->
    <button id="btn-generate" class="btn-generate">2. Generate Bagong QR Code</button>

    <!-- 4) OUTPUT DISPLAY -->
    <div id="result-qr-container">
        <h3 style="color: #155724; margin-top: 0;">Buong QR String na may CRC Hash:</h3>
        <input type="text" id="final-string-output" readonly style="background-color: #fff; text-align: center; font-family: monospace; font-size: 12px; margin-bottom: 15px;">
        <div>
            <div id="qrcode"></div>
        </div>
        <button id="btn-download" style="background-color: #6c757d; width: auto; font-size: 14px; padding: 8px 15px;">I-download ang QR Image (May Quiet Zone)</button>
    </div>
</div>

<script>
    let rawDecodedString = "";

    // 1. Pagbasa sa QR Image gamit ang Html5Qrcode library
    document.getElementById('qr-file').addEventListener('change', function(e) {
        if (!e.target.files || e.target.files.length === 0) return;
        
        const html5QrCode = new Html5Qrcode("qr-reader-box");
        const imageFile = e.target.files[0];
        
        document.getElementById('qr-reader-box').style.background = "#fff";
        document.getElementById('qr-reader-box').innerText = "Ina-analyze ang larawan: " + imageFile.name;

        html5QrCode.scanFile(imageFile, true)
            .then(decodedText => {
                rawDecodedString = decodedText;
                document.getElementById('qr-reader-box').innerText = "✅ Tagumpay na na-scan! Handa nang i-decode.";
                document.getElementById('qr-reader-box').style.background = "#e2f0d9";
            })
            .catch(err => {
                document.getElementById('qr-reader-box').innerText = "❌ Hindi mabasang QR Code. Subukan uli.";
                document.getElementById('qr-reader-box').style.background = "#fce4d6";
                console.error(err);
            });
    });

    // 2. Button 1 Logic: I-decode ang Impormasyon at mag-Auto-Fill (Strict Length Parsing)
    document.getElementById('btn-decode').addEventListener('click', function() {
        let textToParse = rawDecodedString;
        
        if (!textToParse) {
            alert("Mangyaring pumili muna ng QR code image.");
            return;
        }

        // Tiyakin na tinatanggal ang umiiral na Tag 54 (Amount) para maging malinis ang string segmentation
        if (textToParse.includes("540")) {
            textToParse = textToParse.replace(/54\d{2}\d+\.\d{2}/, "");
        }

        // EditText 1: Unang 12 characters ("000201010211")
        let et1 = textToParse.substring(0, 12);
        let remaining = textToParse.substring(12);

        // Hanapin kung nasaan ang '0315' para sa phone parameter placement
        let tag03Index = remaining.indexOf("0315");
        if (tag03Index === -1) {
            alert("Ang QR na ito ay hindi tugma sa karaniwang GCash routing standard.");
            return;
        }

        // EditText 2: Merchant Base payload data up to '0315'
        let et2 = remaining.substring(0, tag03Index + 4);
        let afterEt2 = remaining.substring(tag03Index + 4);

        // EditText 3: Ang eksaktong 15 karakter ng phone segment token ("152170200000006")
        let et3 = afterEt2.substring(0, 15);
        let afterEt3 = afterEt2.substring(15);

        // Hanapin ang CRC Header box ('6304') sa pinakadulo ng data stream
        let crcIndex = afterEt3.indexOf("6304");
        
        // EditText 4: Pangalan, Lokasyon, at lahat ng extra parameters nang buo
        let et4 = afterEt3.substring(0, crcIndex);
        
        // EditText 6: Ang orihinal na CRC data tag block
        let et6 = afterEt3.substring(crcIndex);

        // Ipamahagi ang mga nakuhang halaga sa bawat field elements nang walang bawas na zero
        document.getElementById('edit-text-1').value = et1;
        document.getElementById('edit-text-2').value = et2;
        document.getElementById('edit-text-3').value = et3;
        document.getElementById('edit-text-4').value = et4;
        document.getElementById('edit-text-5').value = ""; // Blangko para sulatan ng bagong halaga
        document.getElementById('edit-text-6').value = et6;

        alert("Naipamahagi na ang impormasyon sa mga EditText fields nang walang bawas na zero!");
    });

    // Opisyal na EMVCo CRC-16 CCITT-FALSE Signature Calculation Code
    function computeCRC16(str) {
        let crc = 0xFFFF;
        for (let c = 0; c < str.length; c++) {
            crc ^= str.charCodeAt(c) << 8;
            for (let i = 0; i < 8; i++) {
                if (crc & 0x8000) {
                    crc = (crc << 1) ^ 0x1021;
                } else {
                    crc = crc << 1;
                }
            }
        }
        let hex = (crc & 0xFFFF).toString(16).toUpperCase();
        return hex.padStart(4, '0');
    }

    // 3. Button 2 Logic: Pagsasama-sama ng mga EditText at pagbuo ng Bagong QR
    document.getElementById('btn-generate').addEventListener('click', function() {
        let et1 = document.getElementById('edit-text-1').value;
        let et2 = document.getElementById('edit-text-2').value;
        let et3 = document.getElementById('edit-text-3').value;
        let et4 = document.getElementById('edit-text-4').value;
        let et5 = document.getElementById('edit-text-5').value;

        if (!et1 || !et2 || !et3 || !et4) {
            alert("Mangyaring i-decode muna ang orihinal na QR code.");
            return;
        }

        // Pagbuo ng panibagong Amount Tag (Tag 54) na sumusunod sa strict EMVCo standards
        let amountTag = "";
        let et4Adjusted = et4;

        if (et5 && parseFloat(et5) > 0) {
            let formattedAmount = parseFloat(et5).toFixed(2);
            let tagLength = String(formattedAmount).length.toString().padStart(2, '0');
            amountTag = "54" + tagLength + formattedAmount;
            
            // Humanap ng anchor sa dulo ng merchant details string segment ('3608') upang maiwasan ang character distortion
            let currencyIndex = et4.indexOf("5303608");
            if (currencyIndex !== -1) {
                let positionToInsert = currencyIndex + 7; // Eksaktong pagkatapos ng '3608'
                et4Adjusted = et4.substring(0, positionToInsert) + amountTag + et4.substring(positionToInsert);
            } else {
                // Fallback safe position kung hindi mahanap ang index track
                let tag58Index = et4.indexOf("5802PH");
                if (tag58Index !== -1) {
                    et4Adjusted = et4.substring(0, tag58Index) + amountTag + et4.substring(tag58Index);
                }
            }
        }

        // PAGSASAMA-SAMA SA TAMANG KAAYUSAN (Pinasok ang string parameters nang may saktong tracking layout)
        let combinedStringWithoutCRC = et1 + et2 + et3 + et4Adjusted + "6304";
        let calculatedCRC = computeCRC16(combinedStringWithoutCRC);
        let finalCompleteQRString = combinedStringWithoutCRC + calculatedCRC;

        // I-update ang UI box elements
        document.getElementById('edit-text-6').value = "6304" + calculatedCRC;
        document.getElementById('final-string-output').value = finalCompleteQRString;

        // Paggawa ng Larawan ng QR Code gamit ang library
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: finalCompleteQRString,
            width: 250,
            height: 250,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });

        document.getElementById('result-qr-container').style.display = "block";
    });

    // Logic para sa madaling pag-download ng nabuong larawan
    document.getElementById('btn-download').addEventListener('click', function() {
        let qrImg = document.querySelector('#qrcode img');
        if (qrImg) {
            let link = document.createElement('a');
            link.href = qrImg.src;
            link.download = 'generated_qrph_payment.png';
            link.click();
        } else {
            alert("Gumawa muna ng QR bago i-download.");
        }
    });
</script>

</body>
</html>
