<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRPh Tool (Manual Reverse & Generate)</title>
    <!-- Matatag na QR Scanner Library -->
    <script src="https://unpkg.com"></script>
    <!-- QR Code Generator Library -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0052cc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background-color: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        h2 {
            color: #0052cc;
            text-align: center;
            margin-top: 0;
        }
        .section {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .section-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-top: 10px;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-blue {
            background-color: #0052cc;
        }
        .btn-blue:hover {
            background-color: #003d99;
        }
        .btn-green {
            background-color: #28a745;
            margin-top: 20px;
        }
        .btn-green:hover {
            background-color: #1e7e34;
        }
        .result-box {
            background-color: #e6f0ff;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
            color: #003d99;
            text-align: left;
            white-space: pre-line;
        }
        .qr-output-container {
            text-align: center;
            margin-top: 20px;
        }
        #qrcode {
            display: inline-block;
            background: white;
            padding: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>QRPh Tool (Reverse & Generate)</h2>
    
    <!-- STEP 1: UPLOAD & NEW BUTTON TO REVERSE -->
    <div class="section">
        <div class="section-title">1) Pumili ng QR Image</div>
        <input type="file" id="qrUpload" accept="image/*">
        
        <!-- Ang buton na lilitaw o magagamit pagkapili ng file -->
        <button id="btnScanNow" class="btn-blue" type="button" style="display: none; background-color: #ff9800;">
            Basahin at I-reverse ang QR Code
        </button>
    </div>

    <!-- STEP 2: AUTO FILL SECTIONS -->
    <div class="section">
        <div class="section-title">2) Hati-hating Bahagi ng QR String</div>
        
        <label>Part 1 (Base/Account Data):</label>
        <input type="text" id="part1Input" placeholder="Naka-abang sa pagbasa...">
        
        <label>Halaga / Amount (Maaaring palitan):</label>
        <input type="number" id="amountInput" placeholder="Naka-abang sa pagbasa..." step="any">
        
        <label>Part 2 (Suffix/Location Data):</label>
        <input type="text" id="part2Input" placeholder="Naka-abang sa pagbasa...">
    </div>

    <!-- STEP 3: DECODE ACCOUNT INFO BUTTON -->
    <button id="btnDecode" class="btn-blue" type="button">I-decode ang Impormasyon ng Account</button>
    <div id="accountInfoOutput" class="result-box" style="display: none;"></div>

    <!-- STEP 4: GENERATE NEW QR BUTTON -->
    <button id="btnGenerate" class="btn-green" type="button">Generate Receive Money via QR</button>
    
    <div class="qr-output-container">
        <div id="qrcode"></div>
    </div>
</div>

<script>
    let selectedFile = null;

    // Kapag pumili ng file ang user, i-save ang file reference at ipakita ang "Basahin" na buton
    document.getElementById('qrUpload').addEventListener('change', function(e) {
        const files = e.target.files;
        if (files && files.length > 0) {
            selectedFile = files;
            // Ipakita ang orange na buton para sa pagbasa
            document.getElementById('btnScanNow').style.display = 'block';
        } else {
            selectedFile = null;
            document.getElementById('btnScanNow').style.display = 'none';
        }
    });

    // Pagpindot sa bagong buton upang simulan ang pag-reverse
    document.getElementById('btnScanNow').addEventListener('click', function() {
        if (!selectedFile) {
            alert("Mangyaring pumili muna ng larawan.");
            return;
        }

        // Gamitin ang Html5Qrcode utility para basahin ang itinatagong file image data
        Html5Qrcode.scanImage(selectedFile, { qrBox: 250 })
            .then(qrCodeText => {
                // Pag naging matagumpay, hatiin ang data string sa mga fields
                parseAndSplitQR(qrCodeText);
                alert("Matagumpay na na-reverse at na-autofill ang mga detalye!");
            })
            .catch(err => {
                alert("Hindi mabasa ang QR sa piniling larawan. Siguraduhing malinaw ang QR code.");
                console.error(err);
            });
    });

    // Paghati-hati sa QR String (Reverse Process)
    function parseAndSplitQR(rawText) {
        const tag54Index = rawText.indexOf("54");
        
        if (tag54Index !== -1) {
            const lengthIndicator = rawText.substring(tag54Index + 2, tag54Index + 4);
            const amountLength = parseInt(lengthIndicator, 10);
            const amountValue = rawText.substring(tag54Index + 4, tag54Index + 4 + amountLength);
            
            const part1 = rawText.substring(0, tag54Index);
            const part2 = rawText.substring(tag54Index + 4 + amountLength, rawText.length - 4);
            
            document.getElementById('part1Input').value = part1;
            document.getElementById('amountInput').value = parseFloat(amountValue);
            document.getElementById('part2Input').value = part2;
        } else {
            // Kung walang nakatakdang halaga sa QR na binasa
            const part1 = rawText.substring(0, rawText.length - 4);
            document.getElementById('part1Input').value = part1;
            document.getElementById('amountInput').value = "";
            document.getElementById('part2Input').value = "";
        }
    }

    // Button Click: I-decode ang Impormasyon ng Account gaya ng Pangalan (Tag 59)
    document.getElementById('btnDecode').addEventListener('click', function() {
        const part1 = document.getElementById('part1Input').value;
        const part2 = document.getElementById('part2Input').value;
        const fullString = part1 + part2;

        if(!fullString) {
            alert("Walang QR data na babasahin. Mangyaring mag-reverse muna ng larawan.");
            return;
        }

        let name = "Hindi mahanap";
        const tag59Index = fullString.indexOf("59");
        if (tag59Index !== -1) {
            const len = parseInt(fullString.substring(tag59Index + 2, tag59Index + 4), 10);
            name = fullString.substring(tag59Index + 4, tag59Index + 4 + len);
        }
        
        const outputDiv = document.getElementById('accountInfoOutput');
        outputDiv.style.display = "block";
        outputDiv.innerHTML = `<strong>Pangalan ng Account:</strong> ${name}\n<strong>Network/Routing:</strong> InstaPay (QRPh)\n<strong>Status:</strong> Handa nang gawan ng bagong presyo.`;
    });

    // Helper function para kalkulahin ang CRC16-CCITT Checksum (CCITT-FALSE)
    function computeCRC16(str) {
        let crc = 0xFFFF;
        for (let c = 0; c < str.length; c++) {
            let code = str.charCodeAt(c);
            crc ^= (code << 8);
            for (let i = 0; i < 8; i++) {
                if ((crc & 0x8000) !== 0) {
                    crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                } else {
                    crc = (crc << 1) & 0xFFFF;
                }
            }
        }
        let hex = crc.toString(16).toUpperCase();
        return hex.padStart(4, '0');
    }

    // Button Click: Generate Receive Money via QR (Muling pagsasama-samahin ang binagong fields)
    document.getElementById('btnGenerate').addEventListener('click', function() {
        const part1 = document.getElementById('part1Input').value;
        const part2 = document.getElementById('part2Input').value;
        const amount = parseFloat(document.getElementById('amountInput').value);

        if (!part1) {
            alert("Kailangan ng laman sa Part 1 field para makapag-generate.");
            return;
        }

        let newPayload = "";

        if (isNaN(amount) || amount <= 0) {
            // Kung tinanggal mo ang halaga sa EditText, magiging open amount ang QR
            newPayload = part1 + part2 + "6304";
        } else {
            const amountStr = amount.toFixed(2);
