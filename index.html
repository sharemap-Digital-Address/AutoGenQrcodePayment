<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRPh Tool (Reverse & Generate)</title>
    
    <!-- Tamang QR Scanner Library (html5-qrcode) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Tamang QR Code Generator Library (qrcodejs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0052cc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background-color: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        h2 {
            color: #0052cc;
            text-align: center;
            margin-top: 0;
        }
        .section {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .section-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-top: 10px;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-blue {
            background-color: #0052cc;
        }
        .btn-blue:hover {
            background-color: #003d99;
        }
        .btn-orange {
            background-color: #ff9800;
        }
        .btn-orange:hover {
            background-color: #e68a00;
        }
        .btn-green {
            background-color: #28a745;
            margin-top: 20px;
        }
        .btn-green:hover {
            background-color: #1e7e34;
        }
        .result-box {
            background-color: #e6f0ff;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
            color: #003d99;
            text-align: left;
            white-space: pre-line;
        }
        .qr-output-container {
            text-align: center;
            margin-top: 20px;
        }
        #qrcode {
            display: inline-block;
            background: white;
            padding: 10px;
            border: 1px solid #ddd;
        }
        #hidden-reader {
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>QRPh Tools (Reverse & Generate)</h2>
    
    <div id="hidden-reader"></div>

    <!-- STEP 1: UPLOAD & BUTTON -->
    <div class="section">
        <div class="section-title">1) Pumili ng QR Image</div>
        <input type="file" id="qrUpload" accept="image/*">
        
        <button id="btnScanNow" class="btn-orange" type="button" style="display: none;">
            Basahin at I-reverse ang QR Code
        </button>
    </div>

    <!-- STEP 2: AUTO FILL SECTIONS -->
    <div class="section">
        <div class="section-title">2) Hati-hating Bahagi ng QR String</div>
        
        <label>Part 1 (Base/Account Data):</label>
        <input type="text" id="part1Input" placeholder="Naka-abang sa pagbasa...">
        
        <label>Halaga / Amount (Maaaring palitan):</label>
        <input type="number" id="amountInput" placeholder="Ilagay ang bagong halaga (Opsyonal)..." step="any">
        
        <label>Part 2 (Suffix/Location Data):</label>
        <input type="text" id="part2Input" placeholder="Naka-abang sa pagbasa...">
    </div>

    <!-- STEP 3: DECODE ACCOUNT INFO BUTTON -->
    <button id="btnDecode" class="btn-blue" type="button">I-decode ang Impormasyon ng Account</button>
    <div id="accountInfoOutput" class="result-box" style="display: none;"></div>

    <!-- STEP 4: GENERATE NEW QR BUTTON -->
    <button id="btnGenerate" class="btn-green" type="button">Generate Receive Money via QR</button>
    
    <div class="qr-output-container">
        <div id="qrcode"></div>
    </div>
</div>

<script>
    let selectedFile = null;

    document.getElementById('qrUpload').addEventListener('change', function(e) {
        const files = e.target.files;
        if (files && files.length > 0) {
            selectedFile = files[0];
            document.getElementById('btnScanNow').style.display = 'block';
        } else {
            selectedFile = null;
            document.getElementById('btnScanNow').style.display = 'none';
        }
    });

    document.getElementById('btnScanNow').addEventListener('click', function() {
        if (!selectedFile) {
            alert("Mangyaring pumili muna ng larawan.");
            return;
        }

        const html5QrCode = new Html5Qrcode("hidden-reader");

        html5QrCode.scanFile(selectedFile, true)
            .then(qrCodeText => {
                parseAndSplitQR(qrCodeText);
                alert("Matagumpay na na-reverse at na-autofill ang mga detalye!");
            })
            .catch(err => {
                alert("Hindi mabasa ang QR sa piniling larawan. Siguraduhing malinaw ang QR code.");
                console.error(err);
            });
    });

    // Pinagbuting Parser na kaya ring humati kahit Static QR (walang Tag 54)
    function parseAndSplitQR(rawText) {
        let index = 0;
        let tag54Start = -1;
        let tag54End = -1;
        let tag53Start = -1;
        let tag58Start = -1;

        while (index < rawText.length - 4) {
            let tag = rawText.substring(index, index + 2);
            let lenStr = rawText.substring(index + 2, index + 4);
            let len = parseInt(lenStr, 10);
            
            if (isNaN(len)) break;
            
            let valueEnd = index + 4 + len;
            
            if (tag === "53") {
                tag53Start = index;
            } else if (tag === "54") {
                tag54Start = index;
                tag54End = valueEnd;
                break;
            } else if (tag === "58") {
                tag58Start = index;
            }
            
            index = valueEnd;
        }

        if (tag54Start !== -1) {
            // Kung Dynamic QR na may kasamang amount
            let splitIndex = (tag53Start !== -1 && tag53Start === tag54Start - 7) ? tag53Start : tag54Start;
            
            const part1 = rawText.substring(0, splitIndex);
            const amountVal = rawText.substring(tag54Start + 4, tag54End);
            const part2 = rawText.substring(tag54End, rawText.length - 4);

            document.getElementById('part1Input').value = part1;
            document.getElementById('amountInput').value = parseFloat(amountVal);
            document.getElementById('part2Input').value = part2;
        } else {
            // Kung Static QR (walang Tag 54), hatiin gamit ang Tag 53 (Currency) o Tag 58 (Country)
            let splitIdx = -1;
            if (tag53Start !== -1) {
                splitIdx = tag53Start;
            } else if (tag58Start !== -1) {
                splitIdx = tag58Start;
            } else {
                splitIdx = rawText.indexOf("5802PH");
                if (splitIdx === -1) splitIdx = rawText.length - 30;
            }

            const part1 = rawText.substring(0, splitIdx);
            const part2 = rawText.substring(splitIdx, rawText.length - 4);

            document.getElementById('part1Input').value = part1;
            document.getElementById('amountInput').value = ""; // Blangko para ikaw maglagay ng gusto mong halaga
            document.getElementById('part2Input').value = part2;
        }
    }

    document.getElementById('btnDecode').addEventListener('click', function() {
        const part1 = document.getElementById('part1Input').value;
        const part2 = document.getElementById('part2Input').value;
        const fullString = part1 + part2;

        if(!fullString) {
            alert("Walang QR data na babasahin. Mangyaring mag-reverse muna ng larawan.");
            return;
        }

        let name = "Hindi mahanap";
        let index = 0;
        while (index < fullString.length) {
            let tag = fullString.substring(index, index + 2);
            let len = parseInt(fullString.substring(index + 2, index + 4), 10);
            if (isNaN(len)) break;
            let val = fullString.substring(index + 4, index + 4 + len);
            if (tag === "59") {
                name = val;
                break;
            }
            index = index + 4 + len;
        }
        
        const outputDiv = document.getElementById('accountInfoOutput');
        outputDiv.style.display = "block";
        outputDiv.innerHTML = `<strong>Pangalan ng Account:</strong> ${name}\n<strong>Network/Routing:</strong> InstaPay (QRPh)\n<strong>Status:</strong> Handa nang gawan ng bagong presyo.`;
    });

    function computeCRC16(str) {
        let crc = 0xFFFF;
        for (let c = 0; c < str.length; c++) {
            let code = str.charCodeAt(c);
            crc ^= (code << 8);
            for (let i = 0; i < 8; i++) {
                if ((crc & 0x8000) !== 0) {
                    crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                } else {
                    crc = (crc << 1) & 0xFFFF;
                }
            }
        }
        let hex = crc.toString(16).toUpperCase();
        return hex.padStart(4, '0');
    }

    document.getElementById('btnGenerate').addEventListener('click', function() {
        const part1 = document.getElementById('part1Input').value;
        const part2 = document.getElementById('part2Input').value;
        const amount = parseFloat(document.getElementById('amountInput').value);

        if (!part1) {
            alert("Kailangan ng laman sa Part 1 field para makapag-generate.");
            return;
        }

        let newPayload = "";

        if (isNaN(amount) || amount <= 0) {
            newPayload = part1 + part2 + "6304";
        } else {
            const amountStr = amount.toFixed(2);
            const lengthStr = amountStr.length.toString().padStart(2, '0');
            const tag54 = "54" + lengthStr + amountStr;
            const currencyTag = "5303608"; // PHP currency code standard sa QRPh
            newPayload = part1 + currencyTag + tag54 + part2 + "6304";
        }

        const finalChecksum = computeCRC16(newPayload);
        const completeQRString = newPayload + finalChecksum;

        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: completeQRString,
            width: 200,
            height: 200,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });
    });
</script>

</body>
</html>
