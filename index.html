<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRPh Tool (Reverse & Generate)</title>
    
    <!-- Tamang QR Scanner Library (html5-qrcode) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Tamang QR Code Generator Library (qrcodejs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0052cc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background-color: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        h2 {
            color: #0052cc;
            text-align: center;
            margin-top: 0;
        }
        .section {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .section-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-top: 10px;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-blue {
            background-color: #0052cc;
        }
        .btn-blue:hover {
            background-color: #003d99;
        }
        .btn-orange {
            background-color: #ff9800;
        }
        .btn-orange:hover {
            background-color: #e68a00;
        }
        .btn-green {
            background-color: #28a745;
            margin-top: 20px;
        }
        .btn-green:hover {
            background-color: #1e7e34;
        }
        .result-box {
            background-color: #e6f0ff;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
            color: #003d99;
            text-align: left;
            white-space: pre-line;
        }
        .qr-output-container {
            text-align: center;
            margin-top: 20px;
        }
        #qrcode {
            display: inline-block;
            background: white;
            padding: 10px;
            border: 1px solid #ddd;
        }
        #hidden-reader {
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>QRPh Tool (Reverse & Generate)</h2>
    
    <div id="hidden-reader"></div>

    <!-- STEP 1: UPLOAD & BUTTON -->
    <div class="section">
        <div class="section-title">1) Pumili ng QR Image</div>
        <input type="file" id="qrUpload" accept="image/*">
        <button id="btnScanNow" class="btn-orange" type="button" style="display: none;">
            Basahin at I-reverse ang QR Code
        </button>
    </div>

    <!-- STEP 2: SECTIONS -->
    <div class="section">
        <div class="section-title">2) Mga Bahagi ng QR String</div>
        
        <label>Part 1 (Base/Account Data):</label>
        <input type="text" id="part1Input" placeholder="Naka-abang sa pagbasa...">
        
        <label>Halaga / Amount (Maaaring palitan):</label>
        <input type="number" id="amountInput" placeholder="Naka-abang sa pagbasa..." step="any">
        
        <label>Part 2 (Suffix/Location Data):</label>
        <input type="text" id="part2Input" placeholder="Naka-abang sa pagbasa...">
    </div>

    <!-- STEP 3: DECODE -->
    <button id="btnDecode" class="btn-blue" type="button">I-decode ang Impormasyon ng Account</button>
    <div id="accountInfoOutput" class="result-box" style="display: none;"></div>

    <!-- STEP 4: GENERATE -->
    <button id="btnGenerate" class="btn-green" type="button">Generate Receive Money via QR</button>
    
    <div class="qr-output-container">
        <div id="qrcode"></div>
    </div>
</div>

<script>
    let selectedFile = null;

    document.getElementById('qrUpload').addEventListener('change', function(e) {
        const files = e.target.files;
        if (files && files.length > 0) {
            selectedFile = files[0];
            document.getElementById('btnScanNow').style.display = 'block';
        } else {
            selectedFile = null;
            document.getElementById('btnScanNow').style.display = 'none';
        }
    });

    document.getElementById('btnScanNow').addEventListener('click', function() {
        if (!selectedFile) {
            alert("Mangyaring pumili muna ng larawan.");
            return;
        }

        const html5QrCode = new Html5Qrcode("hidden-reader");
        html5QrCode.scanFile(selectedFile, true)
            .then(qrCodeText => {
                parseAndSplitQR(qrCodeText);
                alert("Matagumpay na na-reverse at na-autofill ang mga detalye!");
            })
            .catch(err => {
                alert("Hindi mabasa ang QR sa piniling larawan. Siguraduhing malinaw ang QR code.");
                console.error(err);
            });
    });

    // Pagsunod sa eksaktong Python logic para sa pag-parse ng QRPh string
    function parseAndSplitQR(rawText) {
        // Tanggalin ang huling 4 characters (CRC checksum)
        const payloadWithoutCRC = rawText.substring(0, rawText.length - 4);
        
        const tag53Index = payloadWithoutCRC.indexOf("5303608");
        const tag54Index = payloadWithoutCRC.indexOf("54");
        
        if (tag53Index !== -1 && tag54Index !== -1) {
            const part1 = payloadWithoutCRC.substring(0, tag53Index);
            
            const lengthIndicator = payloadWithoutCRC.substring(tag54Index + 2, tag54Index + 4);
            const amountLength = parseInt(lengthIndicator, 10);
            const amountValue = payloadWithoutCRC.substring(tag54Index + 4, tag54Index + 4 + amountLength);
            
            // Part 2: Mula pagkatapos ng amount hanggang dulo
            const part2 = payloadWithoutCRC.substring(tag54Index + 4 + amountLength);
            
            document.getElementById('part1Input').value = part1;
            document.getElementById('amountInput').value = parseFloat(amountValue);
            document.getElementById('part2Input').value = part2;
        } else {
            const part1 = payloadWithoutCRC;
            document.getElementById('part1Input').value = part1;
            document.getElementById('amountInput').value = "";
            document.getElementById('part2Input').value = "";
        }
    }

    document.getElementById('btnDecode').addEventListener('click', function() {
        const part1 = document.getElementById('part1Input').value;
        const amount = parseFloat(document.getElementById('amountInput').value) || 0;
        const amountStr = amount > 0 ? amount.toFixed(2) : "";
        const lengthStr = amountStr.length.toString().padStart(2, '0');
        
        // Buuin pansamantala ang buong string para ma-decode ang Tag 59 (Pangalan)
        const amountPart = amount > 0 ? "530360854" + lengthStr + amountStr : "";
        const part2 = document.getElementById('part2Input').value;
        const fullString = part1 + amountPart + part2;

        if(!fullString) {
            alert("Walang QR data na babasahin. Mangyaring mag-reverse muna ng larawan.");
            return;
        }

        let name = "Hindi mahanap";
        const tag59Index = fullString.indexOf("59");
        if (tag59Index !== -1) {
            const len = parseInt(fullString.substring(tag59Index + 2, tag59Index + 4), 10);
            if (!isNaN(len)) {
                name = fullString.substring(tag59Index + 4, tag59Index + 4 + len);
            }
        }
        
        const outputDiv = document.getElementById('accountInfoOutput');
        outputDiv.style.display = "block";
        outputDiv.innerHTML = `<strong>Pangalan ng Account:</strong> ${name}\n<strong>Network/Routing:</strong> InstaPay (QRPh)\n<strong>Status:</strong> Handa nang gawan ng bagong presyo.`;
    });

    function computeCRC16(str) {
        let crc = 0xFFFF;
        for (let c = 0; c < str.length; c++) {
            let code = str.charCodeAt(c);
            crc ^= (code << 8);
            for (let i = 0; i < 8; i++) {
                if ((crc & 0x8000) !== 0) {
                    crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                } else {
                    crc = (crc << 1) & 0xFFFF;
                }
            }
        }
        let hex = crc.toString(16).toUpperCase();
        return hex.padStart(4, '0');
    }

    // Pag-generate ng bagong QR gamit ang eksaktong Python approach
    document.getElementById('btnGenerate').addEventListener('click', function() {
        const part1 = document.getElementById('part1Input').value;
        const part2 = document.getElementById('part2Input').value;
        const amount = parseFloat(document.getElementById('amountInput').value);

        if (!part1) {
            alert("Kailangan ng laman sa Part 1 field para makapag-generate.");
            return;
        }

        let newPayload = "";
        if (isNaN(amount) || amount <= 0) {
            newPayload = part1 + part2 + "6304";
        } else {
            const amountStr = amount.toFixed(2);
            const lengthStr = amountStr.length.toString().padStart(2, '0');
            // Katulad ng Python code mo: part1 + currency_and_amount + part2
            newPayload = part1 + "530360854" + lengthStr + amountStr + part2 + "6304";
        }

        const finalChecksum = computeCRC16(newPayload);
        const completeQRString = newPayload + finalChecksum;

        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: completeQRString,
            width: 200,
            height: 200,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });
    });
</script>

</body>
</html>
