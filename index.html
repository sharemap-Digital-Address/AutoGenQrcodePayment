<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCash/QRPh Tool (Fix Scanner)</title>
    <!-- Mas matatag na QR Scanner Library para sa mga Cellphone -->
    <script src="https://unpkg.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0052cc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background-color: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        h2 {
            color: #0052cc;
            text-align: center;
            margin-top: 0;
        }
        .section {
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .section-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-top: 10px;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #0052cc;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #003d99;
        }
        .result-box {
            background-color: #e6f0ff;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
            color: #003d99;
            text-align: left;
            white-space: pre-line;
        }
        .qr-output-container {
            text-align: center;
            margin-top: 20px;
        }
        #qrcode {
            display: inline-block;
            background: white;
            padding: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>QRPh Tool (Reverse & Generate)</h2>
    
    <!-- STEP 1: UPLOAD & REVERSE -->
    <div class="section">
        <div class="section-title">1) I-upload ang QR Image</div>
        <input type="file" id="qrUpload" accept="image/*">
    </div>

    <!-- STEP 2: AUTO FILL SECTIONS -->
    <div class="section">
        <div class="section-title">2) Hati-hating Bahagi ng QR String</div>
        
        <label>Part 1 (Base/Account Data):</label>
        <input type="text" id="part1Input" placeholder="Awtomatikong mapupunan">
        
        <label>Halaga / Amount (Maaaring palitan):</label>
        <input type="number" id="amountInput" placeholder="Awtomatikong mapupunan" step="any">
        
        <label>Part 2 (Suffix/Location Data):</label>
        <input type="text" id="part2Input" placeholder="Awtomatikong mapupunan">
    </div>

    <!-- STEP 3: DECODE ACCOUNT INFO BUTTON -->
    <button id="btnDecode" type="button">I-decode ang Impormasyon ng Account</button>
    <div id="accountInfoOutput" class="result-box" style="display: none;"></div>

    <!-- STEP 4: GENERATE NEW QR BUTTON -->
    <button id="btnGenerate" type="button" style="background-color: #28a745;">Generate Receive Money via QR</button>
    
    <div class="qr-output-container">
        <div id="qrcode"></div>
    </div>
</div>

<script>
    // Inisyal na pag-setup ng bagong scanner library
    const html5QrCodeScanner = new Html5Qrcode("qrUpload");

    document.getElementById('qrUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Gamitin ang file scanning feature ng html5-qrcode para malpasan ang CORS block
        Html5Qrcode.scanImage(file, { qrBox: 250 })
            .then(qrCodeText => {
                // Kapag matagumpay na nabasa ang QR string
                parseAndSplitQR(qrCodeText);
            })
            .catch(err => {
                alert("Hindi ma-scan ang QR sa larawan. Siguraduhing malinaw ang QR code o subukan ang ibang screenshot.");
                console.error(err);
            });
    });

    // Paghati-hati sa QR String (Reverse Process)
    function parseAndSplitQR(rawText) {
        const tag54Index = rawText.indexOf("54");
        
        if (tag54Index !== -1) {
            const lengthIndicator = rawText.substring(tag54Index + 2, tag54Index + 4);
            const amountLength = parseInt(lengthIndicator, 10);
            const amountValue = rawText.substring(tag54Index + 4, tag54Index + 4 + amountLength);
            
            const part1 = rawText.substring(0, tag54Index);
            const part2 = rawText.substring(tag54Index + 4 + amountLength, rawText.length - 4);
            
            document.getElementById('part1Input').value = part1;
            document.getElementById('amountInput').value = parseFloat(amountValue);
            document.getElementById('part2Input').value = part2;
        } else {
            const part1 = rawText.substring(0, rawText.length - 4);
            document.getElementById('part1Input').value = part1;
            document.getElementById('amountInput').value = "";
            document.getElementById('part2Input').value = "";
        }
    }

    // Button Click: I-decode ang Impormasyon ng Account
    document.getElementById('btnDecode').addEventListener('click', function() {
        const part1 = document.getElementById('part1Input').value;
        const part2 = document.getElementById('part2Input').value;
        const fullString = part1 + part2;

        if(!fullString) {
            alert("Mangyaring mag-upload muna ng QR code.");
            return;
        }

        let name = "Hindi mahanap";
        const tag59Index = fullString.indexOf("59");
        if (tag59Index !== -1) {
            const len = parseInt(fullString.substring(tag59Index + 2, tag59Index + 4), 10);
            name = fullString.substring(tag59Index + 4, tag59Index + 4 + len);
        }
        
        const outputDiv = document.getElementById('accountInfoOutput');
        outputDiv.style.display = "block";
        outputDiv.innerHTML = `<strong>Pangalan ng Account:</strong> ${name}\n<strong>Network/Routing:</strong> InstaPay (QRPh)\n<strong>Status:</strong> Handa nang gawan ng bagong presyo.`;
    });

    // Helper function para sa CRC16-CCITT Checksum (CCITT-FALSE)
    function computeCRC16(str) {
        let crc = 0xFFFF;
        for (let c = 0; c < str.length; c++) {
            let code = str.charCodeAt(c);
            crc ^= (code << 8);
            for (let i = 0; i < 8; i++) {
                if ((crc & 0x8000) !== 0) {
                    crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                } else {
                    crc = (crc << 1) & 0xFFFF;
                }
            }
        }
        let hex = crc.toString(16).toUpperCase();
        return hex.padStart(4, '0');
    }

    // Button Click: Generate Receive Money via QR
    document.getElementById('btnGenerate').addEventListener('click', function() {
        const part1 = document.getElementById('part1Input').value;
        const part2 = document.getElementById('part2Input').value;
        const amount = parseFloat(document.getElementById('amountInput').value);

        if (!part1) {
            alert("Walang sapat na data para mag-generate.");
            return;
        }

        let newPayload = "";

        if (isNaN(amount) || amount <= 0) {
            newPayload = part1 + part2 + "6304";
        } else {
            const amountStr = amount.toFixed(2);
            const lengthStr = amountStr.length.toString().padStart(2, '0');
            newPayload = part1 + "54" + lengthStr + amountStr + part2 + "6304";
        }

        const finalChecksum = computeCRC16(newPayload.substring(0, newPayload.length - 4) + "6304");
        const completeQRString = newPayload + finalChecksum;

        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: completeQRString,
            width: 200,
            height: 200,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
        });
    });
</script>

</body>
</html>
